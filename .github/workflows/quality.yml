name: Quality Gate
on:
  push:
  pull_request:

jobs:
  structure-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JSON schema syntax
        run: python -m json.tool schema/question.schema.json > /dev/null
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate question bank
        run: python scripts/validate.py
      - name: Check coverage map
        run: python scripts/coverage.py
      - name: Report shortest-answer and absolute-word leakage (advisory, Stage 4v)
        run: python scripts/answer_leakage_metrics.py
      - name: Enforce global and per-module correct-answer length bias threshold (18%)
        run: python scripts/answer_length_bias.py --threshold 0.18 --strict
      - name: Enforce minimum learner-facing explanation length (300 characters)
        run: python scripts/check_explanation_quality.py --minimum 300
      - name: List near-duplicate wording candidates (advisory)
        run: python scripts/similarity.py --threshold 0.45 --limit 15
      - name: Report verified-only release gate (non-exporting)
        run: python scripts/release_gate.py --report
      - name: Check sequential editorial audit integrity
        run: python scripts/check_sequential_audit.py
      - name: Check per-option legal clause review (entire bank)
        run: python scripts/check_legal_clause_review.py
